name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The compiled catalogs are gitignored and the app imports them, so the
      # app project cannot typecheck until they exist. Same first step `npm run
      # build` takes.
      - name: Compile message catalogs
        run: npm run i18n:compile

      # Both projects: the browser app and — via tsconfig.node.json — every
      # route under api/. Nothing else compiles api/ before it deploys.
      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      # Production dependencies only. Dev-only advisories (vitest, sharp, the
      # image pipeline) are real but do not ship to a browser or an edge
      # function; they surface in the weekly Dependabot run instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
