<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icons are pre-trimmed to the mark's own bounding box (see
         scripts/optimize-brand-assets.mjs) so the gear fills the tile instead
         of the browser downscaling the padded 192 PWA icon into a smudge.
         apple-touch-icon stays the padded one — iOS adds its own mask and
         crops a full-bleed mark. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- 180px and flattened onto navy: iOS applies its own rounded-rect mask and
         does NOT honour transparency, so an alpha channel composites to black.
         Generated by scripts/pwa-assets.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- viewport-fit=cover is what lets the page paint into the notch and home
         indicator areas in standalone mode. Without it iOS letterboxes the app
         with opaque bars. It is only safe because the shell pads itself with
         env(safe-area-inset-*) — see the block in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- iOS has no manifest support worth the name: without these three tags an
         "Add to Home Screen" is a browser bookmark that opens in Safari with
         its chrome, rather than a standalone app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the status bar sits OVER the page, which is what
         makes the navy hero run to the top edge. Pairs with the safe-area
         padding; without that padding the content would slide under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KTIP" />
    <!-- FONT-SWAP: app now uses system Arial/Helvetica; only Atkinson Hyperlegible
         (ktip_readable accessibility mode) still loads from Google Fonts.
         Original link kept below for revert:
    <link

      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

         The live link, and both preconnects, now load from the script below and
         ONLY in readable mode. As static tags they cost every visitor a
         render-blocking cross-origin stylesheet — DNS, TLS and a round trip to
         fonts.googleapis.com before the first paint — for four faces that the
         default theme never renders. -->
    <meta name="description" content="KTiP - Knowledge, Technology and Innovation Platform for Caribbean innovators to collaborate, connect, and grow." />
    <!-- Was #041E42 here against #0066cc in manifest.json — two different
         brand colours for the same app, so the installed title bar and the
         browser's own chrome disagreed. Both are now the brand navy. The
         dark-scheme variant matches --color-hero-base under html.dark, so the
         system bars follow the app's own theme instead of staying navy on a
         near-black page. -->
    <meta name="theme-color" content="#041E42" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06210A" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="KTiP - Knowledge, Technology and Innovation Platform" />
    <meta property="og:description" content="Caribbean innovators collaborate, connect, and grow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Readable mode, and the only thing that still needs Google Fonts.
      //
      // The <link> tags used to sit statically in this head, which meant every
      // visitor paid a blocking third-party stylesheet for Atkinson
      // Hyperlegible whether or not they had readable mode on — and the app
      // otherwise renders system Arial/Helvetica, so almost nobody did.
      // Injected here instead: same first-paint timing for the readers who need
      // it (this script runs during head parsing, ahead of the entry module),
      // and no request at all for everyone else.
      try {
        if (localStorage.getItem('ktip_readable') === 'true') {
          document.documentElement.classList.add('readable')
          var add = function (rel, href, cors) {
            var el = document.createElement('link')
            el.rel = rel
            el.href = href
            if (cors) el.crossOrigin = ''
            document.head.appendChild(el)
          }
          add('preconnect', 'https://fonts.googleapis.com')
          add('preconnect', 'https://fonts.gstatic.com', true)
          add(
            'stylesheet',
            'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap'
          )
        }
      } catch (e) {}
      try {
        var t = localStorage.getItem('ktip_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
      // Language, resolved before first paint for the same reason the theme is:
      // React setting it later means a screen reader and the browser's own
      // translation prompt both spend the first frame believing the page is
      // English. ?lang= wins so a shared link lands in the right language on a
      // device that has never chosen one.
      //
      // `dir` is written unconditionally, not only for RTL. Adding Arabic later
      // then means one entry in RTL_LANGS rather than hunting the DOM for the
      // place this was assumed.
      // Mobile-lite: phones, and touch devices up to tablet size.
      //
      // Set here rather than from React so the CSS below can react to it on the
      // FIRST paint — a class applied after mount would run the expensive
      // treatment once and then remove it, which is worse than either state.
      //
      // The query is duplicated from MOBILE_LITE_QUERY in
      // src/hooks/useMediaQuery.ts, which is what component logic reads. Keep
      // the two in step: a mismatch means CSS and JS disagree about which
      // device this is, and the symptom is a layer that is styled away but
      // still being rendered and measured.
      try {
        if (matchMedia('(max-width: 767px), (pointer: coarse) and (max-width: 1279px)').matches)
          document.documentElement.classList.add('mobile-lite')
      } catch (e) {}
      try {
        var q = new URLSearchParams(location.search).get('lang');
        var l = q || localStorage.getItem('ktip_lang');
        if (l !== 'fr' && l !== 'es' && l !== 'pseudo') l = 'en';
        document.documentElement.lang = l === 'pseudo' ? 'en' : l;
        document.documentElement.dir = 'ltr';
        if (q) localStorage.setItem('ktip_lang', l);
      } catch (e) {}
    </script>
    <title>KTiP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
