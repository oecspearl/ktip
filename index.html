<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FONT-SWAP: app now uses system Arial/Helvetica; only Atkinson Hyperlegible
         (ktip_readable accessibility mode) still loads from Google Fonts.
         Original link kept below for revert:
    <link
    
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="KTiP - Knowledge, Technology and Innovation Platform for Caribbean innovators to collaborate, connect, and grow." />
    <meta name="theme-color" content="#041E42" />
    <meta property="og:title" content="KTiP - Knowledge, Technology and Innovation Platform" />
    <meta property="og:description" content="Caribbean innovators collaborate, connect, and grow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      try { if (localStorage.getItem('ktip_readable') === 'true') document.documentElement.classList.add('readable') } catch (e) {}
      try {
        var t = localStorage.getItem('ktip_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>KTiP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
