<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="b110" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="110"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect width="1600" height="640" fill="#04151C"/>
<g filter="url(#b110)">
  <ellipse cx="450" cy="520" rx="520" ry="380" fill="#0E7C7B" style="mix-blend-mode:screen"/>
  <ellipse cx="1050" cy="580" rx="430" ry="320" fill="#2BC8C4" style="mix-blend-mode:screen"/>
  <ellipse cx="780" cy="680" rx="260" ry="200" fill="#EFFFFA" style="mix-blend-mode:screen"/>
</g>

<rect width="1600" height="640" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
